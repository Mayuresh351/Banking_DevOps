services:
  postgres:
    image: postgres:16
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  user-service:
    image: banking-user-service:1.0
    container_name: banking-user-service
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: banking
      DATABASE_USER: banking_user
      DATABASE_PASSWORD: banking_password
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  transaction-service:
    image: banking-transaction-service:1.0
    container_name: banking-transaction-service
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: banking
      DATABASE_USER: banking_user
      DATABASE_PASSWORD: banking_password
    ports:
      - "8001:8001"
    depends_on:
      - postgres

volumes:
  postgres_data:
