name: Banking Services CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test user service
        working-directory: services/user-service
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest
          flake8 main.py

      - name: Test transaction service
        working-directory: services/transaction-service
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. pytest
          flake8 main.py

      - name: Build user service Docker image
        run: |
          docker build -t banking-user-service:ci ./services/user-service

      - name: Build transaction service Docker image
        run: |
          docker build -t banking-transaction-service:ci ./services/transaction-service

      - name: Scan user service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: banking-user-service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"

      - name: Scan transaction service image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: banking-transaction-service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"
